name: Deploy Astro site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BUILD_PATH: "."
  NODE_VERSION: "20"

jobs:
  fetch_data:
    name: Fetch External Data
    runs-on: ubuntu-latest
    outputs:
      failures: ${{ steps.fetch.outputs.failures }}
      warnings: ${{ steps.fetch.outputs.warnings }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          
      - name: Fetch external data
        id: fetch
        env:
          # Route only the TPT/Instagram fetches through the home tailnet privoxy so
          # they egress from a residential IP (both block GitHub datacenter IPs). Those
          # calls set an explicit proxy agent from HTTP_PROXY. HTTPS_PROXY is intentionally
          # NOT set, so plain HTTPS calls (e.g. the exchange-rate API, which allows
          # datacenter IPs) go direct instead of being broken by the ad-filter proxy.
          HTTP_PROXY: "http://100.119.88.63:8118"
          NO_PROXY: "localhost,127.0.0.1,v6.exchangerate-api.com"
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: |
          # Each fetch is allowed to fail without blocking the deploy -- the scripts
          # leave the previous good fixture in place, so the site simply redeploys with
          # yesterday's data. Failures are recorded here and reported by the
          # `data_health` job below, which DOES fail so the run goes red and notifies.
          failures=""
          warnings=""

          echo "Checking proxy reachability ($HTTP_PROXY)..."
          if curl -s -o /dev/null -w "  TPT via proxy -> http=%{http_code}\n" --max-time 25 -x "$HTTP_PROXY" https://www.teacherspayteachers.com/robots.txt; then
            echo "  proxy OK"
          else
            echo "::error title=Tailnet proxy unreachable::$HTTP_PROXY did not answer from CI. Check that the runner joined the tailnet as tag:ci and that the tailnet policy grants tag:ci -> tag:gateway:8118."
            failures="$failures proxy"
          fi

          # Known and accepted: Meta closed the anonymous web_profile_info endpoint
          # (401 require_login), so this cannot succeed without a credential. The
          # script leaves the previously fetched posts in place, so the footer just
          # goes stale rather than empty. Warn instead of failing the run; move
          # `instagram` back into `failures` if we ever wire up a token.
          node fetch-instagram-posts.mjs   || { echo "::warning title=Instagram fetch failed (known)::Meta requires login for the public profile endpoint; the footer keeps its existing posts."; warnings="$warnings instagram"; }
          node fetch-tpt-products.mjs RELEVANCE   || { echo "::error title=TpT RELEVANCE fetch failed::see log above"; failures="$failures tpt_RELEVANCE"; }
          node fetch-tpt-products.mjs MOST_RECENT || { echo "::error title=TpT MOST_RECENT fetch failed::see log above"; failures="$failures tpt_MOST_RECENT"; }

          echo "Fetched record counts:"
          node -e "for (const f of ['instagram_posts','tpt_products_RELEVANCE','tpt_products_MOST_RECENT']) { try { const d = require('./src/lib/fixtures/'+f+'.json'); console.log('  '+f+': '+(Array.isArray(d)?d.length:'n/a')); } catch { console.log('  '+f+': missing'); } }"

          echo "failures=${failures# }" >> "$GITHUB_OUTPUT"
          echo "warnings=${warnings# }" >> "$GITHUB_OUTPUT"

      - name: Upload fetched data
        uses: actions/upload-artifact@v4
        with:
          name: external-data
          path: |
            ./src/lib/fixtures/instagram_posts.json
            ./src/lib/fixtures/tpt_products_MOST_RECENT.json
            ./src/lib/fixtures/tpt_products_RELEVANCE.json
            ./public/images/instagram/*

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit and Push changes
        run: |
          git add ./src/lib/fixtures/instagram_posts.json || true
          git add ./src/lib/fixtures/tpt_products_MOST_RECENT.json || true
          git add ./src/lib/fixtures/tpt_products_RELEVANCE.json || true
          git add ./public/images/instagram/* || true
          git commit -m "Update external data [skip ci]" || true
          git push origin master || true

  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: fetch_data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download fetched data
        uses: actions/download-artifact@v4
        with:
          name: external-data

      - name: Generate Google Merchant product review feed
        # Writes public/product-reviews.xml so the deployed site serves it at
        # https://ciarasclassroom.com/product-reviews.xml, which Merchant Center is
        # configured to fetch on a schedule. Must run before the Astro build.
        run: node google-merchant-review-feed.xml.mjs

      - name: Build Site
        env:
          TINACLIENTID: ${{ secrets.TINACLIENTID }}
          TINATOKEN: ${{ secrets.TINATOKEN }}
          TINASEARCH: ${{ secrets.TINASEARCH }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow (Bing / Yandex / Seznam …)
        # Notifies the IndexNow ecosystem that URLs changed so they recrawl
        # within minutes. Reads ./dist/sitemap-index.xml; never fails the deploy.
        run: node submit-indexnow.mjs || true

  data_health:
    name: Data Health
    needs: fetch_data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download fetched data
        uses: actions/download-artifact@v4
        with:
          name: external-data

      - name: Assert the fixtures are populated
        run: node check-fixtures.mjs

      - name: Report known-stale data
        if: needs.fetch_data.outputs.warnings != ''
        run: |
          echo "::warning title=External data is stale (known)::These fetches failed:${{ needs.fetch_data.outputs.warnings }}. This is expected and does not fail the run."

      - name: Fail if any fetch errored
        if: needs.fetch_data.outputs.failures != ''
        run: |
          echo "::error title=External data is stale::These fetches failed:${{ needs.fetch_data.outputs.failures }}. The site still deployed, but with the previously committed data. Check the tailnet proxy first."
          exit 1

  upload_google_products:
    name: Upload Google Products
    needs: fetch_data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download fetched data
        uses: actions/download-artifact@v4
        with:
          name: external-data

      - name: Upload Google Products
        env:
          MERCHANT_ID: ${{ secrets.MERCHANT_ID }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_TOKEN }}' > token.json
          PRODUCT_COUNT=$(node -e "try { const d = require('./src/lib/fixtures/tpt_products_MOST_RECENT.json'); console.log(Array.isArray(d) ? d.length : 0); } catch { console.log(0); }")
          echo "Fetched product count: $PRODUCT_COUNT"
          if [ "$PRODUCT_COUNT" -gt 0 ]; then
            # Upsert first, then prune what the feed no longer contains. The old order
            # (delete everything, then re-insert) reset every offer's history in
            # Merchant Center and left the account empty if the upload then failed.
            node google-merchent.mjs
            node delete-google-merchant.mjs
          else
            echo "No products were fetched — skipping Google Merchant sync to avoid wiping existing listings."
          fi
